<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PEP</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      padding: 0 0 40px 0;
    }
    header { text-align: center; padding: 36px 20px 20px; }
    header h1 { font-size: 2rem; font-weight: bold; letter-spacing: 0.05em; color: #f0f0f0; }
    header p { font-size: 0.65rem; letter-spacing: 0.2em; color: #555; margin-top: 6px; text-transform: uppercase; }
    .home { padding: 20px 24px; }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .card:active { background: #222; }
    .card h2 { font-size: 1.6rem; font-weight: normal; }
    .card p { font-size: 0.6rem; letter-spacing: 0.18em; color: #555; margin-top: 6px; text-transform: uppercase; }
    .card.properties h2 { color: #c8702a; }
    .card.energy h2 { color: #4a7fa5; }
    .card.people h2 { color: #888; }
    .screen { display: none; padding: 0 24px; }
    .screen.active { display: block; }
    .screen-header { display: flex; align-items: center; padding: 28px 24px 16px; gap: 12px; }
    .back-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; padding: 4px 8px 4px 0; }
    .screen-header h2 { font-size: 1.4rem; font-weight: bold; color: #f0f0f0; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.6rem; letter-spacing: 0.18em; color: #555; text-transform: uppercase; margin-bottom: 8px; }
    input[type="text"], textarea, select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      padding: 14px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: #444; }
    textarea { min-height: 90px; resize: vertical; }
    .eagles-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .eagle-btn {
      flex: 1;
      min-width: 36px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #555;
      font-size: 0.85rem;
      padding: 12px 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-family: 'Georgia', serif;
    }
    .eagle-btn.selected { background: #1e3a1e; border-color: #4a7a4a; color: #7ac47a; }
    .photo-upload {
      background: #1a1a1a;
      border: 1px dashed #2a2a2a;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      color: #444;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    .photo-upload input { display: none; }
    .photo-previews { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .photo-previews img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
    .submit-btn {
      width: 100%;
      background: #c8702a;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      letter-spacing: 0.08em;
      padding: 18px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .submit-btn:active { background: #a85a20; }
    .submit-btn.energy-btn { background: #4a7fa5; }
    .submit-btn.energy-btn:active { background: #3a6a8a; }
    .submit-btn.people-btn { background: #666; }
    .status-msg { text-align: center; font-size: 0.8rem; color: #555; margin-top: 14px; min-height: 20px; }
    .status-msg.success { color: #7ac47a; }
    .status-msg.error { color: #c47a7a; }
    .auth-bar {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 14px;
      margin: 0 24px 16px;
      text-align: center;
      font-size: 0.8rem;
      color: #555;
    }
    .auth-bar.connected { color: #7ac47a; }
    .sign-in-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.85rem;
      font-family: 'Georgia', serif;
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- HOME -->
  <div id="home">
    <header>
      <h1>PEP</h1>
      <p>Properties · Energy · People</p>
    </header>
    <div class="auth-bar" id="auth-bar">
      <div id="auth-status">Not signed in to Google Drive</div>
      <button class="sign-in-btn" onclick="signIn()">Sign in for photo upload</button>
    </div>
    <div class="home">
      <div class="card properties" onclick="show('properties')">
        <h2>Properties</h2>
        <p>Capture · Research · Log</p>
      </div>
      <div class="card energy" onclick="show('energy')">
        <h2>Energy</h2>
        <p>Instinct · Discovery · Zones</p>
      </div>
      <div class="card people" onclick="show('people')">
        <h2>People</h2>
        <p>Leads · Contacts · Clients</p>
      </div>
    </div>
  </div>

  <!-- PROPERTIES -->
  <div class="screen" id="properties">
    <div class="screen-header">
      <button class="back-btn" onclick="show('home')">←</button>
      <h2>Properties</h2>
    </div>
    <div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="p-address" placeholder="Street address" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="p-status">
          <option value="">Select status</option>
          <option>Listed</option>
          <option>Unlisted</option>
          <option>Unknown</option>
        </select>
      </div>
      <div class="form-group">
        <label>Property Type</label>
        <select id="p-type">
          <option value="">Select type</option>
          <option>Single Family</option>
          <option>Condo</option>
          <option>Multi-Unit</option>
          <option>Commercial Mix</option>
          <option>Unknown</option>
        </select>
      </div>
      <div class="form-group">
        <label>Distress Signals</label>
        <select id="p-distress">
          <option value="">Select if visible</option>
          <option>Overgrown</option>
          <option>Signage Heavy</option>
          <option>Boarded</option>
          <option>Vacant</option>
          <option>None Visible</option>
        </select>
      </div>
      <div class="form-group">
        <label>My Listing?</label>
        <select id="p-mylisting">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>
      <div class="form-group">
        <label>Eagles — First Impression (required)</label>
        <div class="eagles-row" id="p-eagles">
          <button class="eagle-btn" onclick="setEagles('p',1)">1</button>
          <button class="eagle-btn" onclick="setEagles('p',2)">2</button>
          <button class="eagle-btn" onclick="setEagles('p',3)">3</button>
          <button class="eagle-btn" onclick="setEagles('p',4)">4</button>
          <button class="eagle-btn" onclick="setEagles('p',5)">5</button>
          <button class="eagle-btn" onclick="setEagles('p',6)">6</button>
          <button class="eagle-btn" onclick="setEagles('p',7)">7</button>
        </div>
      </div>
      <div class="form-group">
        <label>Photos (up to 5)</label>
        <div class="photo-upload" onclick="document.getElementById('p-photos').click()">
          Tap to add photos
          <input type="file" id="p-photos" accept="image/*" multiple capture="environment" onchange="previewPhotos('p')" />
        </div>
        <div class="photo-previews" id="p-previews"></div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="p-notes" placeholder="Anything else worth remembering..."></textarea>
      </div>
      <button class="submit-btn" onclick="submitProperty()">Log Property</button>
      <div class="status-msg" id="p-status-msg"></div>
    </div>
  </div>

  <!-- ENERGY -->
  <div class="screen" id="energy">
    <div class="screen-header">
      <button class="back-btn" onclick="show('home')">←</button>
      <h2>Energy</h2>
    </div>
    <div>
      <div class="form-group">
        <label>Location or Area</label>
        <input type="text" id="e-location" placeholder="Neighborhood, intersection, or description" />
      </div>
      <div class="form-group">
        <label>Eagles — Field Instinct (required)</label>
        <div class="eagles-row" id="e-eagles">
          <button class="eagle-btn" onclick="setEagles('e',1)">1</button>
          <button class="eagle-btn" onclick="setEagles('e',2)">2</button>
          <button class="eagle-btn" onclick="setEagles('e',3)">3</button>
          <button class="eagle-btn" onclick="setEagles('e',4)">4</button>
          <button class="eagle-btn" onclick="setEagles('e',5)">5</button>
          <button class="eagle-btn" onclick="setEagles('e',6)">6</button>
          <button class="eagle-btn" onclick="setEagles('e',7)">7</button>
        </div>
      </div>
      <div class="form-group">
        <label>Photos (up to 5)</label>
        <div class="photo-upload" onclick="document.getElementById('e-photos').click()">
          Tap to add photos
          <input type="file" id="e-photos" accept="image/*" multiple capture="environment" onchange="previewPhotos('e')" />
        </div>
        <div class="photo-previews" id="e-previews"></div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="e-notes" placeholder="What caught your eye? What does it feel like?"></textarea>
      </div>
      <button class="submit-btn energy-btn" onclick="submitEnergy()">Log Energy</button>
      <div class="status-msg" id="e-status-msg"></div>
    </div>
  </div>

  <!-- PEOPLE -->
  <div class="screen" id="people">
    <div class="screen-header">
      <button class="back-btn" onclick="show('home')">←</button>
      <h2>People</h2>
    </div>
    <div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="pe-name" placeholder="Full name" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="pe-phone" placeholder="Phone number" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="text" id="pe-email" placeholder="Email address" />
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="pe-type">
          <option value="">Select type</option>
          <option>Buyer</option>
          <option>Seller</option>
          <option>Agent</option>
          <option>Broker</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Photo (business card, headshot, where you met)</label>
        <div class="photo-upload" onclick="document.getElementById('pe-photos').click()">
          Tap to add a photo
          <input type="file" id="pe-photos" accept="image/*" multiple capture="environment" onchange="previewPhotos('pe')" />
        </div>
        <div class="photo-previews" id="pe-previews"></div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="pe-notes" placeholder="How you met, what they're looking for, anything relevant..."></textarea>
      </div>
      <button class="submit-btn people-btn" onclick="submitPerson()">Log Person</button>
      <div class="status-msg" id="pe-status-msg"></div>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwf95XKWBwLiplbvIne7kAbO7mBbV_qWj2jEkRbDQA92RTJ92aL7A_bQH94GXWqlgEdtA/exec";
  const CLIENT_ID = "663410387269-sm5dite9i6ln8pcr14fd93gtl90ehie8.apps.googleusercontent.com";
  const SCOPES = "https://www.googleapis.com/auth/drive.file";

  let accessToken = null;
  let eaglesVal = { p: 0, e: 0 };

  function signIn() {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (response) => {
        if (response.access_token) {
          accessToken = response.access_token;
          document.getElementById('auth-status').textContent = '✓ Connected to Google Drive';
          document.getElementById('auth-bar').classList.add('connected');
          document.querySelector('.sign-in-btn').style.display = 'none';
        }
      }
    });
    client.requestAccessToken();
  }

  async function uploadPhotosToDrive(files, folderName) {
    if (!accessToken || files.length === 0) return '';

    // Create folder
    const folderRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${accessToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        name: folderName,
        mimeType: 'application/vnd.google-apps.folder'
      })
    });
    const folder = await folderRes.json();
    const folderId = folder.id;

    // Upload each file
    for (let i = 0; i < Math.min(files.length, 5); i++) {
      const file = files[i];
      const metadata = { name: `photo_${i+1}_${file.name}`, parents: [folderId] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', file);
      await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${accessToken}` },
        body: form
      });
    }

    return `https://drive.google.com/drive/folders/${folderId}`;
  }

  function show(id) {
    document.getElementById('home').style.display = id === 'home' ? 'block' : 'none';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    if (id !== 'home') document.getElementById(id).classList.add('active');
  }

  function setEagles(prefix, val) {
    eaglesVal[prefix] = val;
    document.querySelectorAll(`#${prefix}-eagles .eagle-btn`).forEach((btn, i) => {
      btn.classList.toggle('selected', i < val);
    });
  }

  function previewPhotos(prefix) {
    const input = document.getElementById(`${prefix}-photos`);
    const preview = document.getElementById(`${prefix}-previews`);
    preview.innerHTML = '';
    Array.from(input.files).slice(0, 5).forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  }

  function getFilledCount(fields) {
    return fields.filter(f => f && f.trim() !== '').length;
  }

  function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status-msg ' + (type || '');
  }

  function clearForm(textIds, selectIds, eaglesPrefix, photoInputId, previewId) {
    textIds.forEach(id => document.getElementById(id).value = '');
    selectIds.forEach(id => document.getElementById(id).selectedIndex = 0);
    if (eaglesPrefix) {
      eaglesVal[eaglesPrefix] = 0;
      document.querySelectorAll(`#${eaglesPrefix}-eagles .eagle-btn`).forEach(btn => btn.classList.remove('selected'));
    }
    if (photoInputId) document.getElementById(photoInputId).value = '';
    if (previewId) document.getElementById(previewId).innerHTML = '';
  }

  async function submitProperty() {
    const address = document.getElementById('p-address').value;
    const status = document.getElementById('p-status').value;
    const type = document.getElementById('p-type').value;
    const distress = document.getElementById('p-distress').value;
    const mylisting = document.getElementById('p-mylisting').value;
    const notes = document.getElementById('p-notes').value;
    const eagles = eaglesVal['p'];

    if (getFilledCount([address, status, type, notes]) < 2) { setStatus('p-status-msg', 'Fill in at least 2 fields.', 'error'); return; }
    if (!eagles) { setStatus('p-status-msg', 'Eagles rating is required.', 'error'); return; }

    setStatus('p-status-msg', 'Uploading photos...', '');
    const files = Array.from(document.getElementById('p-photos').files);
    const folderName = `PEP — ${address || 'Property'} — ${new Date().toLocaleDateString()}`;
    const photoFolder = await uploadPhotosToDrive(files, folderName);

    setStatus('p-status-msg', 'Logging...', '');
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'property',
          timestamp: new Date().toISOString(),
          address, status, propertyType: type,
          distress, myListing: mylisting,
          eagles, notes, photoFolder
        })
      });
      setStatus('p-status-msg', '🦅 Property logged.', 'success');
      clearForm(['p-address','p-notes'], ['p-status','p-type','p-distress','p-mylisting'], 'p', 'p-photos', 'p-previews');
    } catch(e) {
      setStatus('p-status-msg', 'Something went wrong. Try again.', 'error');
    }
  }

  async function submitEnergy() {
    const location = document.getElementById('e-location').value;
    const notes = document.getElementById('e-notes').value;
    const eagles = eaglesVal['e'];

    if (getFilledCount([location, notes]) < 2) { setStatus('e-status-msg', 'Fill in at least 2 fields.', 'error'); return; }
    if (!eagles) { setStatus('e-status-msg', 'Eagles rating is required.', 'error'); return; }

    setStatus('e-status-msg', 'Uploading photos...', '');
    const files = Array.from(document.getElementById('e-photos').files);
    const folderName = `PEP — ${location || 'Energy'} — ${new Date().toLocaleDateString()}`;
    const photoFolder = await uploadPhotosToDrive(files, folderName);

    setStatus('e-status-msg', 'Logging...', '');
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'energy',
          timestamp: new Date().toISOString(),
          location, eagles, notes, photoFolder
        })
      });
      setStatus('e-status-msg', '🦅 Energy logged.', 'success');
      clearForm(['e-location','e-notes'], [], 'e', 'e-photos', 'e-previews');
    } catch(e) {
      setStatus('e-status-msg', 'Something went wrong. Try again.', 'error');
    }
  }

  async function submitPerson() {
    const name = document.getElementById('pe-name').value;
    const phone = document.getElementById('pe-phone').value;
    const email = document.getElementById('pe-email').value;
    const type = document.getElementById('pe-type').value;
    const notes = document.getElementById('pe-notes').value;

    if (getFilledCount([name, phone, email, notes]) < 2) { setStatus('pe-status-msg', 'Fill in at least 2 fields.', 'error'); return; }

    setStatus('pe-status-msg', 'Uploading photo...', '');
    const files = Array.from(document.getElementById('pe-photos').files);
    const folderName = `PEP — ${name || 'Person'} — ${new Date().toLocaleDateString()}`;
    const photoFolder = await uploadPhotosToDrive(files, folderName);

    setStatus('pe-status-msg', 'Logging...', '');
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'person',
          timestamp: new Date().toISOString(),
          name, phone, email, personType: type, notes, photoFolder
        })
      });
      setStatus('pe-status-msg', '✓ Person logged.', 'success');
      clearForm(['pe-name','pe-phone','pe-email','pe-notes'], ['pe-type'], null, 'pe-photos', 'pe-previews');
    } catch(e) {
      setStatus('pe-status-msg', 'Something went wrong. Try again.', 'error');
    }
  }
</script>
</body>
</html>
